# Render Blueprint: Decision Layer public demo (free plan, open models on).
# Deploy: https://render.com/deploy?repo=https://github.com/abhijitbetigeri/DecisionLayer
#
# - Free plan: no persistent disk, so demo state resets on restart and fixtures re-seed on start.
#   The service sleeps after ~15 min idle; the first request after that takes ~1 minute.
# - Models on: Gemma 4 parses typed briefs, gpt-oss-120b is the buyer agent, Jev screens updates.
#   RESPAN_API_KEY and AI_GATEWAY_API_KEY are dashboard-only secrets (sync: false): set them in
#   Render > Environment. They are never stored in this repo, and pushes do not overwrite them.
#   Without keys the app degrades safely: presets parse briefs and the agent shows the labeled
#   "Rule-based evaluation". public_guard caps model use (5 evaluations, 2 agent runs per session,
#   PROOFPATH_MODEL_HOURLY_CAP calls per hour across everyone).
# - The operator token is generated by Render: copy it from the dashboard (Environment tab).
services:
  - type: web
    name: decision-layer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Render terminates TLS at its proxy; trust X-Forwarded-For so per-IP limits see real clients.
    dockerCommand: uvicorn sv.proofpath.app:app --host 0.0.0.0 --port 8080 --workers 1 --proxy-headers --forwarded-allow-ips=*
    envVars:
      - key: PORT
        value: "8080"
      - key: PROOFPATH_DATA_DIR
        value: /data
      - key: PROOFPATH_DEMO_MODE
        value: public
      - key: PROOFPATH_ENABLE_LLM
        value: "1"
      - key: PROOFPATH_MODEL_HOURLY_CAP
        value: "60"
      - key: PROOFPATH_OPERATOR_TOKEN
        generateValue: true
      - key: RESPAN_BASE_URL
        value: https://api.respan.ai
      - key: RESPAN_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
