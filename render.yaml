# Render Blueprint: Decision Layer public demo (free plan, no model keys).
# Deploy: https://render.com/deploy?repo=https://github.com/abhijitbetigeri/DecisionLayer
#
# - Free plan: no persistent disk, so demo state resets on restart and fixtures re-seed on start.
#   The service sleeps after ~15 min idle; the first request after that takes ~1 minute.
# - PROOFPATH_ENABLE_LLM=0: presets parse briefs, the POC is pure code, and the buyer agent shows the
#   labeled "Rule-based evaluation". No model credits can be spent from the public URL.
#   To enable open models later, add RESPAN_API_KEY / AI_GATEWAY_API_KEY in the dashboard and
#   set PROOFPATH_ENABLE_LLM=1 (public_guard caps still apply).
# - The operator token is generated by Render: copy it from the dashboard (Environment tab).
services:
  - type: web
    name: decision-layer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Render terminates TLS at its proxy; trust X-Forwarded-For so per-IP limits see real clients.
    dockerCommand: uvicorn sv.proofpath.app:app --host 0.0.0.0 --port 8080 --workers 1 --proxy-headers --forwarded-allow-ips=*
    envVars:
      - key: PORT
        value: "8080"
      - key: PROOFPATH_DATA_DIR
        value: /data
      - key: PROOFPATH_DEMO_MODE
        value: public
      - key: PROOFPATH_ENABLE_LLM
        value: "0"
      - key: PROOFPATH_MODEL_HOURLY_CAP
        value: "60"
      - key: PROOFPATH_OPERATOR_TOKEN
        generateValue: true
